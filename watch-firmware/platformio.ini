; SmartServe — Smartwatch Client Firmware
; Board: ESP32 WROOM-32 (esp32dev)
; Display: 1.28" rund GC9A01 240x240 SPI
;
; Zwei Build-Umgebungen:
;   esp32dev        -> MS2-Firmware, direktes Zeichnen mit TFT_eSPI  (src/main.cpp)
;   esp32dev-lvgl   -> LVGL-GUI-Geruest                              (src/main_lvgl.cpp)
;
; Build:  pio run -e esp32dev            (bzw. -e esp32dev-lvgl)
; Flash:  pio run -e esp32dev -t upload
; Serial: pio device monitor -b 115200

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
    bodmer/TFT_eSPI @ ^2.5.43

; --- TFT_eSPI Konfiguration fuer GC9A01 (Pins = Verdrahtungstabelle) ---
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

; ── MS2: direktes Zeichnen (Standard) ──────────────────────────────
[env:esp32dev]
build_src_filter = +<*> -<main_lvgl.cpp>

; ── LVGL-GUI-Geruest ───────────────────────────────────────────────
[env:esp32dev-lvgl]
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl @ ^8.3.11
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
build_src_filter = +<*> -<main.cpp>
