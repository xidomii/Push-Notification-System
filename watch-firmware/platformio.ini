; SmartServe — Smartwatch Client Firmware
; Board: ESP32-S3 SuperMini
;
; MEILENSTEIN 1: nur Empfang von Testnachrichten vom Broker (Serial-Ausgabe).
; Display-Libs (TFT_eSPI) + ArduinoJson kommen erst ab MS2 dazu.
;
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor -b 115200

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1        ; passt fuer ESP32-S3 SuperMini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8

; --- PSRAM: nur aktivieren wenn Board FH4R2 (2 MB PSRAM) hat ---
; board_build.arduino.memory_type = qio_opi
; build_flags = -DBOARD_HAS_PSRAM
