; SmartServe — Smartwatch Client Firmware
; Board: ESP32-S3 SuperMini
; Display: 1.28" rund GC9A01 240x240 SPI
;
; Stand: MS2 (Empfang + Anzeige am Display).
;
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
    bodmer/TFT_eSPI @ ^2.5.43

; --- PSRAM: nur aktivieren wenn Board FH4R2 (2 MB PSRAM) hat ---
; board_build.arduino.memory_type = qio_opi
; build_flags = -DBOARD_HAS_PSRAM

; --- TFT_eSPI Konfiguration fuer GC9A01 (Pins = Verdrahtungstabelle) ---
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
